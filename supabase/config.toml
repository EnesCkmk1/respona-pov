# Minimal Supabase CLI config for local development.
# Run `supabase init` to regenerate the full file if needed; it will keep
# the migrations in supabase/migrations untouched.

project_id = "respona"

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local dev only — set the real site URL in the Supabase dashboard for prod.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/dashboard"]

[api]
enabled = true
port = 54321
schemas = ["public"]
